<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahasia</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="page-1">
        <form id="passwordForm">
        <label for="password">Password:</label>
        <input type="password" id="password" required>
        <button type="submit">Masuk</button>
    </form>
    <div style="display: none;" id="textrahasia">
        <p>Untuk Sintya Widya Yang Cantik, Sang pujaan hati ku</p>
    </div>
    <p id="pesanError"></p>
    </div>
    
<script>
    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('password');
    const password1 = "adekksyng";
    // Ambil elemen div rahasia dan pesan error
    const kontenRahasia = document.getElementById('textrahasia');
    const pesanError = document.getElementById('pesanError');

    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Tahan reload halaman
        
        const passwordValue = passwordInput.value;

        if (passwordValue === password1) {
            // 1. Munculkan div rahasia
            kontenRahasia.style.display = "block";
            
            // 2. Bersihkan pesan error jika sebelumnya ada
            pesanError.textContent = ""; 
        } else {
            // Jika salah, pastikan div tetap sembunyi dan munculkan error
            kontenRahasia.style.display = "none";
            pesanError.textContent = "❌ Password Salah!";
        }
    });
</script>

</body>
</html>
